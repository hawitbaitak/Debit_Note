<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إصدار المستندات الموحد</title>
    <link rel="icon" type="image/png" href="noti.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans Arabic', sans-serif; background-color: #f3f4f6; margin: 0; }
        
        @media print {
            body { background-color: white !important; }
            .no-print { display: none !important; }
            .a4-page { margin: 0 !important; box-shadow: none !important; border: none !important; }
            @page { margin: 10mm; size: A4 portrait; }
            .landscape-page { @page { size: A4 landscape; } }
        }

        .a4-page {
            width: 210mm; min-height: 297mm; padding: 15mm; margin: 20px auto;
            background: white; box-shadow: 0 0 15px rgba(0,0,0,0.1); position: relative; border: 1px solid #e5e7eb;
        }

        .a4-landscape { width: 297mm !important; min-height: 210mm !important; }

        /* الهيدر الموحد */
        .unified-header {
            display: flex; justify-content: space-between; align-items: flex-end;
            border-bottom: 2px solid #1e3a8a; padding-bottom: 10px; margin-bottom: 20px;
        }

        /* الفوتر الموحد */
        .unified-footer {
            position: absolute; bottom: 10mm; left: 15mm; right: 15mm;
            display: flex; justify-content: space-between; align-items: flex-end;
            border-top: 1px solid #d1d5db; pt-2; font-size: 11px; font-weight: bold; color: #374151;
        }

        .data-label { font-weight: bold; color: #1e3a8a; min-width: 120px; display: inline-block; }
        .data-value { border-bottom: 1px dashed #d1d5db; flex-grow: 1; padding-right: 10px; font-weight: bold; }
        
        /* مكان الختم */
        .stamp-container { position: relative; width: 150px; text-align: center; }
        .official-stamp {
            position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
            width: 110px; opacity: 0.85; mix-blend-multiply: multiply; z-index: 20;
        }
    </style>
</head>
<body>

    <div class="max-w-4xl mx-auto bg-white p-6 mt-6 rounded-xl shadow-lg no-print border-t-4 border-blue-900" id="controls">
        <div class="flex justify-center gap-2 mb-6 overflow-x-auto pb-2">
            <button onclick="switchDoc('debit')" id="btn-debit" class="bg-blue-900 text-white px-5 py-2 rounded-lg font-bold">إشعار خصم</button>
            <button onclick="switchDoc('warning')" id="btn-warning" class="bg-gray-200 text-gray-700 px-5 py-2 rounded-lg font-bold">إنذار</button>
            <button onclick="switchDoc('memo')" id="btn-memo" class="bg-gray-200 text-gray-700 px-5 py-2 rounded-lg font-bold">مذكرة داخلية</button>
            <button onclick="switchDoc('delegate')" id="btn-delegate" class="bg-gray-200 text-gray-700 px-5 py-2 rounded-lg font-bold">حساب المناديب</button>
        </div>

        <div id="inputs-area" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <input type="text" id="main-name" oninput="sync()" placeholder="الاسم الكامل" class="border p-3 rounded">
            <input type="text" id="main-ref" oninput="sync()" placeholder="رقم الطلب / المرجع" class="border p-3 rounded">
            <div id="debit-only" class="md:col-span-2 grid grid-cols-3 gap-2">
                <input type="number" id="val-base" oninput="sync()" placeholder="الأساسية" class="border p-2 rounded">
                <input type="number" id="val-mfg" oninput="sync()" placeholder="التصنيع" class="border p-2 rounded">
                <input type="number" id="val-ship" oninput="sync()" placeholder="الشحن" class="border p-2 rounded">
            </div>
            <div id="delegate-only" class="hidden md:col-span-2">
                 <select id="sel-month" onchange="sync()" class="border p-3 w-full rounded mb-2">
                    <option>أبريل 2026</option><option>مايو 2026</option>
                 </select>
                 <input type="file" onchange="handleExcel(event)" class="border p-2 w-full rounded text-sm">
            </div>
        </div>

        <button onclick="window.print()" class="w-full mt-6 bg-green-700 text-white font-bold py-3 rounded-lg hover:bg-green-800 transition">طباعة المستند الحالي</button>
    </div>

    <div id="printable-page" class="a4-page">
        
        <div class="unified-header">
            <div class="text-right leading-tight">
                <h1 class="text-xl font-black text-gray-900">هوية بيتك</h1>
                <p class="text-xs font-bold text-gray-700">س.ت: 1010460174</p>
            </div>
            <div class="flex flex-col items-center">
                <img src="logo1.png" class="h-16 mb-1" alt="Logo">
                <div id="doc-title-tag" class="bg-blue-900 text-white px-4 py-1 rounded text-sm font-bold">إشعار خصم</div>
            </div>
            <div class="text-left leading-tight" dir="ltr">
                <h1 class="text-lg font-black text-gray-900">homeidentity</h1>
                <p class="text-[10px] font-bold text-gray-700">C.R: 1010460174</p>
            </div>
        </div>

        <div id="content-body" class="py-4 min-h-[200mm]">
            </div>

        <div class="unified-footer">
            <div class="text-right">
                <p>المملكة العربية السعودية - الرياض</p>
                <p>الرقم الموحد: 920000000</p>
            </div>
            <div class="text-center italic opacity-30 text-[9px]">هذا المستند صادر آلياً من نظام هوية بيتك</div>
            <div class="text-left" dir="ltr">
                <p>Riyadh, Saudi Arabia</p>
                <p>www.homeidentity.sa</p>
            </div>
        </div>
    </div>

    <script>
        let mode = 'debit';

        function switchDoc(type) {
            mode = type;
            const page = document.getElementById('printable-page');
            const titleTag = document.getElementById('doc-title-tag');
            const debitIn = document.getElementById('debit-only');
            const delegIn = document.getElementById('delegate-only');

            // ضبط اتجاه الصفحة وتنسيق الألوان
            if(type === 'delegate') {
                page.classList.add('a4-landscape');
                titleTag.textContent = "حساب مندوب";
                titleTag.className = "bg-blue-900 text-white px-4 py-1 rounded text-sm font-bold";
                debitIn.classList.add('hidden'); delegIn.classList.remove('hidden');
            } else if(type === 'warning') {
                page.classList.remove('a4-landscape');
                titleTag.textContent = "إشعار إنذار";
                titleTag.className = "bg-red-700 text-white px-4 py-1 rounded text-sm font-bold";
                debitIn.classList.add('hidden'); delegIn.classList.add('hidden');
            } else {
                page.classList.remove('a4-landscape');
                titleTag.textContent = type === 'memo' ? "مذكرة داخلية" : "إشعار خصم";
                titleTag.className = "bg-blue-900 text-white px-4 py-1 rounded text-sm font-bold";
                debitIn.classList.remove('hidden'); delegIn.classList.add('hidden');
            }
            sync();
        }

        function sync() {
            const body = document.getElementById('content-body');
            const name = document.getElementById('main-name').value || "................................";
            const ref = document.getElementById('main-ref').value || "................";
            
            if(mode === 'debit') {
                const b = parseFloat(document.getElementById('val-base').value) || 0;
                const m = parseFloat(document.getElementById('val-mfg').value) || 0;
                const s = parseFloat(document.getElementById('val-ship').value) || 0;
                body.innerHTML = `
                    <div class="space-y-6 mt-10">
                        <div class="flex items-end"><span class="data-label">السيد / السادة:</span><span class="data-value">${name}</span></div>
                        <div class="flex items-end"><span class="data-label">رقم الطلب:</span><span class="data-value">${ref}</span></div>
                        <div class="grid grid-cols-2 gap-10 mt-10">
                            <div class="border p-4 rounded-lg bg-gray-50">
                                <p class="flex justify-between mb-2"><span>اللوحة الأساسية:</span> <b>${b} ر.س</b></p>
                                <p class="flex justify-between mb-2"><span>تصنيع اللوحة:</span> <b>${m} ر.س</b></p>
                                <p class="flex justify-between"><span>قيمة الشحن:</span> <b>${s} ر.س</b></p>
                            </div>
                            <div class="bg-blue-900 text-white p-6 rounded-lg text-center">
                                <p class="text-sm opacity-80">إجمالي مبلغ الخصم</p>
                                <p class="text-4xl font-black">${m + s} <small class="text-xs">ر.س</small></p>
                            </div>
                        </div>
                    </div>
                    <div class="flex justify-around mt-32">
                        <div class="stamp-container"><div class="border-t pt-2 font-bold text-blue-900">توقيع المستلم</div></div>
                        <div class="stamp-container">
                            <img src="logo2.png" class="official-stamp" style="bottom: 25px;">
                            <div class="border-t pt-2 font-bold text-blue-900">الختم الرسمي</div>
                        </div>
                    </div>`;
            } else if(mode === 'delegate') {
                const month = document.getElementById('sel-month').value;
                body.innerHTML = `
                    <div class="flex justify-between items-center bg-gray-100 p-4 rounded mb-6">
                        <div class="text-lg"><b>المندوب:</b> ${name}</div>
                        <div class="text-lg"><b>شهر الحساب:</b> ${month}</div>
                    </div>
                    <table class="w-full border-collapse border-2 border-black text-center text-sm mb-4">
                        <tr class="bg-blue-900 text-white">
                            <th class="border border-black p-2">سعر الفردي</th><th class="border border-black p-2">عدد</th>
                            <th class="border border-black p-2">سعر المكرر</th><th class="border border-black p-2">عدد</th>
                            <th class="border border-black p-2 bg-blue-700">إجمالي المستحق</th>
                        </tr>
                        <tr>
                            <td class="border border-black p-3">20</td><td class="border border-black p-3">0</td>
                            <td class="border border-black p-3">10</td><td class="border border-black p-3">0</td>
                            <td class="border border-black p-3 font-black text-xl">0.00</td>
                        </tr>
                    </table>
                    <div id="excel-view" class="mt-4 text-[10px]"></div>
                    <div class="flex justify-end mt-4">
                        <div class="stamp-container" style="margin-top: -30px;">
                            <img src="logo2.png" class="official-stamp" style="bottom: 15px; width: 130px;">
                            <div class="border-t-2 border-blue-900 pt-1 font-bold text-blue-900 mt-16">الختم الرسمي</div>
                        </div>
                    </div>`;
            }
        }

        function handleExcel(e) {
            const reader = new FileReader();
            reader.onload = (event) => {
                const wb = XLSX.read(event.target.result, {type:'array'});
                const html = XLSX.utils.sheet_to_html(wb.Sheets[wb.SheetNames[0]]);
                document.getElementById('excel-view').innerHTML = html;
            };
            reader.readAsArrayBuffer(e.target.files[0]);
        }

        window.onload = () => switchDoc('debit');
    </script>
</body>
</html>
